<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EngLish - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            background:
                radial-gradient(circle at top left,
                    #eeeeff 0%,
                    transparent 35%),
                linear-gradient(135deg,
                    #f8f9ff,
                    #eef0ff);

            color: #101828;
        }

        /* =========================
           MAIN CARD
        ========================= */

        .auth-card {
            width: 100%;
            max-width: 470px;

            background: #ffffff;

            border-radius: 24px;

            padding: 42px;

            box-shadow:
                0 20px 60px rgba(40, 45, 90, 0.10);

            border: 1px solid #eef0f6;
        }

        /* =========================
           HEADER
        ========================= */

        .logo-box {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: #f0efff;

            color: #625bff;

            font-size: 25px;

            margin-bottom: 24px;

            box-shadow:
                0 8px 25px rgba(98, 91, 255, 0.12);
        }

        .title {
            font-size: 30px;
            font-weight: 800;

            letter-spacing: -0.8px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #667085;
            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {
            width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr;

            padding: 4px;

            background: #f1f3f7;

            border-radius: 12px;

            margin-bottom: 28px;
        }

        .tab {
            border: none;

            background: transparent;

            padding: 12px;

            border-radius: 9px;

            color: #667085;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .tab.active {
            background: #ffffff;

            color: #625bff;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           FORM
        ========================= */

        .form {
            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        .form-group {
            width: 100%;
        }

        .form-label {
            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #344054;

            margin-bottom: 8px;
        }

        /* =========================
           INPUT
        ========================= */

        .input-wrapper {
            position: relative;

            width: 100%;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #98a2b3;

            font-size: 16px;

            pointer-events: none;
        }

        .form-input {
            width: 100%;

            height: 50px;

            border: 1.5px solid #dfe3eb;

            border-radius: 11px;

            background: #ffffff;

            padding: 0 44px;

            font-family: inherit;

            font-size: 14px;

            color: #101828;

            outline: none;

            transition: 0.2s ease;
        }

        .form-input::placeholder {
            color: #98a2b3;
        }

        .form-input:focus {
            border-color: #625bff;

            box-shadow:
                0 0 0 4px rgba(98, 91, 255, 0.10);
        }

        .password-toggle {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #98a2b3;

            cursor: pointer;

            font-size: 16px;
        }

        /* =========================
           OPTIONS
        ========================= */

        .form-options {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: -4px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;

            color: #475467;

            cursor: pointer;
        }

        .remember input {
            width: 16px;
            height: 16px;

            accent-color: #625bff;
        }

        .forgot {
            color: #625bff;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* =========================
           BUTTON
        ========================= */

        .submit-btn {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 11px;

            background: #625bff;

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            box-shadow:
                0 10px 25px rgba(98, 91, 255, 0.22);

            transition: 0.2s ease;
        }

        .submit-btn:hover {
            background: #554df0;

            transform: translateY(-1px);

            box-shadow:
                0 13px 28px rgba(98, 91, 255, 0.28);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fff1f1;

            color: #d92d20;

            border: 1px solid #ffd6d3;
        }

        .message.success {
            display: block;

            background: #ecfdf3;

            color: #027a48;

            border: 1px solid #abefc6;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 28px;

            padding-top: 22px;

            border-top: 1px solid #eef0f4;

            text-align: center;

            font-size: 13px;

            color: #667085;
        }

        .footer a {
            color: #625bff;

            font-weight: 600;

            text-decoration: none;
        }

        /* =========================
           HIDDEN
        ========================= */

        .hidden {
            display: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {

            body {
                padding: 15px;
            }

            .auth-card {
                padding: 30px 22px;

                border-radius: 20px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 13px;
            }

        }

        @media (max-width: 360px) {

            .auth-card {
                padding: 25px 18px;
            }

            .form-options {
                align-items: flex-start;

                gap: 10px;
            }

            .remember {
                font-size: 12px;
            }

            .forgot {
                font-size: 12px;
            }

        }
    </style>
</head>


<body>

    <div class="auth-card">

        <!-- HEADER -->

        <div class="logo-box">
            👤
        </div>

        <h1 class="title" id="formTitle">
            Welcome Back
        </h1>

        <p class="subtitle" id="formSubtitle">
            Sign in to continue your English learning journey.
        </p>


        <!-- TABS -->

        <div class="tabs">

            <button class="tab active" id="loginTab" type="button">
                ↪ &nbsp; Sign In
            </button>

            <button class="tab" id="signupTab" type="button">
                👤+ &nbsp; Sign Up
            </button>

        </div>


        <!-- =========================
         LOGIN FORM
    ========================= -->

        <form class="form" id="loginForm">

            <div class="form-group">

                <label class="form-label" for="loginEmail">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input class="form-input" type="email" id="loginEmail" placeholder="Enter your registered email"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label class="form-label" for="loginPassword">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input class="form-input" type="password" id="loginPassword" placeholder="Enter your password"
                        required>

                    <button class="password-toggle" type="button" onclick="togglePassword('loginPassword', this)">
                        👁
                    </button>

                </div>

            </div>


            <div class="form-options">

                <label class="remember">

                    <input type="checkbox" id="rememberMe">

                    Remember me

                </label>

                <a href="#" class="forgot" id="forgotPassword">
                    Forgot Password?
                </a>

            </div>


            <div class="message" id="loginMessage"></div>


            <button class="submit-btn" type="submit">
                Sign In
                <span>→</span>
            </button>

        </form>


        <!-- =========================
         SIGN UP FORM
    ========================= -->

        <form class="form hidden" id="signupForm">

            <div class="form-group">

                <label class="form-label" for="fullName">
                    Full Name
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input class="form-input" type="text" id="fullName" placeholder="Enter your full name" required>

                </div>

            </div>


            <div class="form-group">

                <label class="form-label" for="signupEmail">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input class="form-input" type="email" id="signupEmail" placeholder="Enter your email" required>

                </div>

            </div>


            <div class="form-group">

                <label class="form-label" for="signupPassword">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input class="form-input" type="password" id="signupPassword" placeholder="Create a password"
                        required>

                    <button class="password-toggle" type="button" onclick="togglePassword('signupPassword', this)">
                        👁
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label class="form-label" for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔐
                    </span>

                    <input class="form-input" type="password" id="confirmPassword" placeholder="Confirm your password"
                        required>

                    <button class="password-toggle" type="button" onclick="togglePassword('confirmPassword', this)">
                        👁
                    </button>

                </div>

            </div>


            <div class="message" id="signupMessage"></div>


            <button class="submit-btn" type="submit">
                Create Account
                <span>→</span>
            </button>

        </form>


        <!-- FOOTER -->

        <div class="footer">

            Want to start practicing now?

            <a href="../index.html">
                Explore LSRW Modules
            </a>

        </div>

    </div>


    <!-- =========================================
     SUPABASE
========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        function getPostLoginDestination() {
            const requested = new URLSearchParams(window.location.search).get("next");
            if (!requested) return new URL("index.html", window.location.href).href;

            try {
                const destination = new URL(requested, window.location.origin);
                const loginPath = new URL("login.html", window.location.href).pathname;
                if (destination.origin === window.location.origin && destination.pathname !== loginPath) {
                    return destination.href;
                }
            } catch (error) {
                console.warn("Ignoring invalid post-login destination.", error);
            }

            return new URL("index.html", window.location.href).href;
        }

        // Supabase Auth throttles email sends across the project/provider.
        // Keep a short browser-side cooldown to prevent repeated clicks and retries.
        const EMAIL_SEND_COOLDOWN_MS = 60 * 1000;
        const emailSendInFlight = new Set();

        function emailCooldownKey(action, email) {
            return `auth-email-cooldown:${action}:${email.trim().toLowerCase()}`;
        }

        function emailRateLimitMessage(error) {
            const message = (error?.message || "").toLowerCase();
            if (message.includes("rate limit") || message.includes("too many") || message.includes("email rate limit")) {
                return "Supabase has temporarily limited email delivery. Wait before trying again, and check your inbox and spam folder for an email that may already have arrived. If this continues, configure a custom SMTP provider in Supabase Auth settings.";
            }
            return error?.message || "The request failed. Please try again later.";
        }

        function emailCooldownRemaining(action, email) {
            const sentAt = Number(localStorage.getItem(emailCooldownKey(action, email)) || 0);
            return Math.max(0, EMAIL_SEND_COOLDOWN_MS - (Date.now() - sentAt));
        }

        function markEmailAttempt(action, email) {
            localStorage.setItem(emailCooldownKey(action, email), String(Date.now()));
        }

        /* =========================
           ELEMENTS
        ========================= */

        const loginTab =
            document.getElementById("loginTab");

        const signupTab =
            document.getElementById("signupTab");

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");

        const formTitle =
            document.getElementById("formTitle");

        const formSubtitle =
            document.getElementById("formSubtitle");


        /* =========================
           SWITCH TO LOGIN
        ========================= */

        loginTab.addEventListener("click", () => {

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

            loginForm.classList.remove("hidden");
            signupForm.classList.add("hidden");

            formTitle.textContent =
                "Welcome Back";

            formSubtitle.textContent =
                "Sign in to continue your English learning journey.";
        });


        /* =========================
           SWITCH TO SIGN UP
        ========================= */

        signupTab.addEventListener("click", () => {

            signupTab.classList.add("active");
            loginTab.classList.remove("active");

            signupForm.classList.remove("hidden");
            loginForm.classList.add("hidden");

            formTitle.textContent =
                "Create an Account";

            formSubtitle.textContent =
                "Join EngLish to track your LSRW and IELTS progress.";
        });


        /* =========================
           PASSWORD VISIBILITY
        ========================= */

        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁";
            }
        }


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const email =
                    document.getElementById("loginEmail").value;

                const password =
                    document.getElementById("loginPassword").value;

                const message =
                    document.getElementById("loginMessage");

                message.className = "message";

                if (!window.supabaseAuth) {

                    message.textContent =
                        "Supabase is not loaded.";

                    message.classList.add("error");

                    return;
                }

                const result =
                    await window.supabaseAuth.signIn(
                        email,
                        password
                    );

                if (result.error) {

                    message.textContent =
                        result.error.message;

                    message.classList.add("error");

                    return;
                }

                message.textContent =
                    "Login successful! Redirecting...";

                message.classList.add("success");


                setTimeout(() => {

                    window.location.href = getPostLoginDestination();

                }, 1000);

            }
        );


        /* =========================
           SIGN UP
        ========================= */

        signupForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const fullName =
                    document.getElementById("fullName").value;

                const email =
                    document.getElementById("signupEmail").value;

                const password =
                    document.getElementById("signupPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const message =
                    document.getElementById("signupMessage");

                const requestKey = `signup:${email.trim().toLowerCase()}`;

                if (emailSendInFlight.has(requestKey)) return;

                const cooldown = emailCooldownRemaining("signup", email);
                if (cooldown > 0) {
                    message.textContent = `Please wait ${Math.ceil(cooldown / 1000)} seconds before trying this email again.`;
                    message.className = "message error";
                    return;
                }

                message.className = "message";


                /* Password match */

                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.classList.add("error");

                    return;
                }


                /* Minimum password */

                if (password.length < 6) {

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    message.classList.add("error");

                    return;
                }


                if (!window.supabaseAuth) {

                    message.textContent =
                        "Supabase is not loaded.";

                    message.classList.add("error");

                    return;
                }


                let result;
                emailSendInFlight.add(requestKey);
                markEmailAttempt("signup", email);
                try {
                    result = await window.supabaseAuth.signUp(email, password, fullName);
                } finally {
                    emailSendInFlight.delete(requestKey);
                }


                if (result.error) {

                    message.textContent = emailRateLimitMessage(result.error);

                    message.classList.add("error");

                    return;
                }


                message.textContent =
                    "Account created successfully! Check your email if verification is required.";

                message.classList.add("success");

                signupForm.reset();

            }
        );


        /* =========================
           FORGOT PASSWORD
        ========================= */

        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                async (event) => {

                    event.preventDefault();

                    const email =
                        document.getElementById("loginEmail").value;

                    const message =
                        document.getElementById("loginMessage");

                    const requestKey = `reset:${email.trim().toLowerCase()}`;
                    if (emailSendInFlight.has(requestKey)) return;

                    const cooldown = emailCooldownRemaining("reset", email);
                    if (cooldown > 0) {
                        message.textContent = `Please wait ${Math.ceil(cooldown / 1000)} seconds before requesting another reset email.`;
                        message.className = "message error";
                        return;
                    }


                    if (!email) {

                        message.textContent =
                            "Enter your email address first.";

                        message.className =
                            "message error";

                        return;
                    }


                    let result;
                    emailSendInFlight.add(requestKey);
                    markEmailAttempt("reset", email);
                    try {
                        result = await window.supabaseAuth.resetPassword(email);
                    } finally {
                        emailSendInFlight.delete(requestKey);
                    }


                    if (result.error) {

                        message.textContent = emailRateLimitMessage(result.error);

                        message.className =
                            "message error";

                        return;
                    }


                    message.textContent =
                        "Password reset email sent.";

                    message.className =
                        "message success";
                }
            );

    </script>

</body>

</html>
